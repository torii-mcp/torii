[package]
name = "torii"
version = "0.4.0"
edition = "2021"
description = "Controlled MCP execution boundary for infrastructure agents"
license = "AGPL-3.0-only"

[dependencies]
dirs = "5"
eframe = "0.29"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "2.2.0", features = ["client", "server", "transport-child-process", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync"] }
toml_edit = "0.25"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The audit key lives in the operating system's credential store: Credential
# Manager (DPAPI) on Windows, Keychain on macOS, Secret Service on Linux.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Turns on escape sequences in the console, for the bold in `torii log`. The
# crate is already in the tree through tokio; this only names the feature.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
assert_matches = "1"

# The audit log's SQLite is SQLite3 Multiple Ciphers, which encrypts the whole
# file. See vendor/README.md.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
